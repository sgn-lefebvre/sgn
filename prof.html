<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#15231E">
  <meta name="apple-mobile-web-app-title" content="Suivi SGN">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Suivi SGN · Espace professeur</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 110 110'%3E%3Crect width='110' height='110' rx='24' fill='%2315231E'/%3E%3Cg fill='%23FFF4E4'%3E%3Crect x='20' y='64' width='14' height='24' rx='2'/%3E%3Crect x='40' y='52' width='14' height='36' rx='2'/%3E%3Crect x='60' y='38' width='14' height='50' rx='2'/%3E%3C/g%3E%3Ccircle cx='72' cy='52' r='17' fill='%2315231E' stroke='%23F09080' stroke-width='6'/%3E%3Cline x1='84' y1='64' x2='96' y2='78' stroke='%23F09080' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon-prof.png">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("sgn-theme"); } catch (e) {}
      if (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) { t = "dark"; }
      document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
    })();
  </script>
  <style>
    /* ---------- Page de suivi : en-tête sombre, deux parties (la classe, élève par élève) ---------- */
    :root { --entete: #15231E; --entete-2: #22352E; --entete-txt: #EEF3EF; --entete-soft: #AFC2BA; --doux: #F4F7F5; --vide: #E3EAE6;
      /* Une couleur par chapitre (1 vert d'eau, 2 jaune, 3 corail, 4 violet, 5 bleu, 6 vert), puis on recommence */
      --ch1: #70C4B4; --ch1s: #E5F3F0; --ch2: #F5BB5C; --ch2s: #FCEBCB; --ch3: #F09080; --ch3s: #FBE2DD;
      --ch4: #A99BE0; --ch4s: #ECE8FA; --ch5: #7FB2E5; --ch5s: #E3EEF9; --ch6: #9CCB7A; --ch6s: #EAF4E1; }
    :root[data-theme="dark"] { --entete: #0B1311; --entete-2: #1A2723; --doux: #16211E; --vide: #2D3C37;
      --ch1s: #1C3632; --ch2s: #4D3C1D; --ch3s: #4B2C26; --ch4s: #2E2A4A; --ch5s: #1E3046; --ch6s: #253A1E; }
    body { font-size: 1rem; }
    .p-entete { background: var(--entete); color: var(--entete-txt); }
    .p-entete-in { max-width: 1120px; margin: 0 auto; padding: 18px clamp(16px, 4vw, 32px) 0; }
    .p-marque { display: flex; align-items: center; gap: 14px; padding-bottom: 18px; }
    .p-marque svg { flex: none; }
    .p-marque h1 { font-size: 1.6rem; line-height: 1; color: var(--entete-txt); }
    .p-marque p { margin: 3px 0 0; color: var(--entete-soft); font-size: .9rem; }
    .p-maj { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--entete-soft); font-size: .85rem; }
    .p-maj[hidden] { display: none; }
    .btn-clair { border: 1.5px solid #3A4D46; background: transparent; color: var(--entete-txt); border-radius: 12px; padding: 8px 14px; font-weight: 700; font-size: .95rem; }
    .btn-clair:hover { border-color: var(--entete-txt); }
    .btn-clair[disabled] { opacity: .6; cursor: progress; }
    .p-parties { display: flex; gap: 6px; }
    .p-parties[hidden] { display: none; }
    .p-partie { border: 0; background: transparent; color: var(--entete-soft); padding: 12px 20px 14px; border-radius: 14px 14px 0 0; font-family: var(--display); font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
    .p-partie:hover { color: var(--entete-txt); }
    .p-partie[aria-pressed=true] { background: var(--bg); color: var(--ink); }
    .p-page { padding-block: 24px 64px; }
    .p-erreur-maj { color: #F3A090; font-weight: 700; }

    /* Connexion */
    .suivi-form { display: grid; gap: 12px; max-width: 520px; margin: 10px auto 0; text-align: center; }
    .suivi-form h2 { font-size: 1.5rem; }
    .suivi-form p { margin: 0; }
    .suivi-form .btn { width: 100%; }
    .mdp-ligne { display: flex; gap: 8px; }
    .mdp-ligne input { flex: 1; min-width: 0; }
    .oeil { padding: 0 14px; border: 2px solid var(--line); border-radius: var(--r-sm); background: var(--card); color: var(--ink); font: inherit; font-weight: 700; }
    .suivi-form input[type=password], .suivi-form input[type=text] { min-height: 48px; padding: 8px 14px; border: 2px solid var(--line); border-radius: var(--r-sm); background: var(--bg); color: var(--ink); font-size: 1.05rem; }

    /* Puces de navigation (vue d'ensemble, chapitres, jeux) */
    .p-sous { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
    .p-puce { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 16px; font-weight: 700; font-size: .95rem; }
    .p-puce:hover { border-color: var(--ink); }
    .p-puce[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
    .p-puce .pt { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
    .p-puce.chap[aria-pressed=true] { color: #15231E; }
    .p-puce.chap[aria-pressed=true] .pt { background: #15231E !important; }
    .p-h2 { font-size: 1.35rem; margin: 0 0 12px; }
    .p-aide { color: var(--ink-soft); font-size: .88rem; margin: -4px 0 12px; }

    /* Chiffres clés */
    .p-cles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 28px; }
    .p-cle { border-radius: 20px; padding: 18px 18px 16px; }
    .p-cle b { display: block; font-family: var(--display); font-weight: 800; font-size: 2.3rem; line-height: 1; }
    .p-cle span { display: block; margin-top: 8px; font-weight: 700; font-size: .95rem; }
    .p-cle small { display: block; color: var(--ink-soft); font-size: .82rem; margin-top: 2px; }
    .k1 { background: var(--card); box-shadow: var(--shadow); } .k2 { background: var(--teal-soft); } .k3 { background: var(--sun-soft); } .k4 { background: var(--coral-soft); }

    /* Cartes des chapitres */
    .p-chapitres { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-bottom: 30px; }
    .p-chap { background: var(--card); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); display: flex; gap: 16px; align-items: center; border: 2px solid transparent; text-align: left; }
    .p-chap:hover { border-color: var(--ink); }
    .p-chap { position: relative; overflow: hidden; padding-top: 24px; }
    .p-chap::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 8px; background: var(--cc); }
    .p-chap.ferme { background: var(--ccs); box-shadow: none; }
    .p-chap .cadenas { flex: none; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--card); font-size: 1.6rem; }
    .p-chap h3 { font-family: var(--text); font-size: 1rem; line-height: 1.25; letter-spacing: 0; font-weight: 700; }
    .p-chap p { margin: 4px 0 0; color: var(--ink-soft); font-size: .85rem; }
    .p-chap .voir { display: inline-block; margin-top: 8px; font-weight: 700; font-size: .85rem; }
    .anneau { flex: none; }
    .anneau text { font-family: var(--display); font-weight: 800; fill: var(--ink); }

    /* Tableaux */
    .p-carte { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 14px; }
    .p-scroll { overflow-x: auto; }
    .p-tab { border-collapse: collapse; width: 100%; min-width: 0; font-size: .93rem; }
    .p-tab th, .p-tab td { border: 0; vertical-align: middle; }
    .p-tab thead th { background: var(--card); font-family: var(--text); }
    .p-tab th { text-align: left; color: var(--ink-soft); font-weight: 700; font-size: .8rem; padding: 10px 12px; white-space: nowrap; }
    .p-tab th.tri { cursor: pointer; } .p-tab th.tri:hover { color: var(--ink); }
    .p-tab td { padding: 9px 12px; border-top: 1px solid var(--line); white-space: nowrap; }
    .p-tab tr.ligne-eleve { cursor: pointer; }
    .p-tab tr.ligne-eleve:hover td { background: var(--doux); }
    .p-tab td:first-child, .p-tab th:first-child { position: sticky; left: 0; background: var(--card); z-index: 1; }
    .p-tab tr.ligne-eleve:hover td:first-child { background: var(--doux); }
    .p-nom { display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .p-nom small { color: var(--ink-soft); font-weight: 400; }
    .ini { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .8rem; flex: none; }
    .i0 { background: var(--coral-soft); color: var(--ko); } .i1 { background: var(--teal-soft); color: var(--ok); } .i2 { background: var(--sun-soft); color: var(--ink); }
    .p-mini { display: flex; align-items: center; gap: 8px; }
    .p-mini .b { width: 70px; height: 8px; border-radius: 4px; background: var(--vide); overflow: hidden; }
    .p-mini .b i { display: block; height: 100%; border-radius: 4px; }
    .p-mini em { font-style: normal; font-weight: 700; font-size: .85rem; min-width: 38px; }
    .p-quand { font-size: .82rem; color: var(--ink-soft); }
    .p-quand.vieux { color: var(--ko); font-weight: 700; }
    .p-det th.theme { text-align: center; color: var(--ink); font-weight: 700; font-size: .82rem; border-left: 3px solid var(--bg); white-space: normal; min-width: 190px; }
    .p-det th.n, .p-det td.n { text-align: center; }
    .p-det td.n { padding: 8px 6px; }
    .p-det .pre { border-left: 3px solid var(--bg); }
    .pill { display: inline-block; min-width: 48px; padding: 3px 8px; border-radius: 8px; font-weight: 700; font-size: .85rem; text-align: center; }
    .pv { background: var(--ok-soft); color: var(--ok); } .pm { background: var(--sun-soft); color: var(--ink); } .pz { background: var(--ko-soft); color: var(--ko); }
    .p-tab tr.moy td { background: var(--doux); font-weight: 700; border-top: 2px solid var(--line); }
    .p-legende { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--ink-soft); margin: 4px 0 26px; }
    .p-legende span { display: flex; align-items: center; gap: 6px; }
    .p-legende i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
    .p-titre-autres { font-size: 1.1rem; margin: 26px 0 6px; }
    .p-bandeau { background: var(--ccs); border-radius: 20px; padding: 18px 20px; margin-bottom: 18px; display: flex; align-items: center; gap: 14px; }
    .p-bandeau .num { flex: none; width: 52px; height: 52px; border-radius: 50%; background: var(--cc); color: #15231E; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1.5rem; }
    .p-bandeau h2 { font-size: 1.3rem; line-height: 1.15; }
    .p-bandeau p { margin: 4px 0 0; color: var(--ink-soft); font-size: .88rem; }
    .p-section { font-size: 1.15rem; margin: 30px 0 10px; display: flex; align-items: center; gap: 10px; }
    .p-section::before { content: ""; width: 6px; height: 22px; border-radius: 3px; background: var(--cc); }
    .p-det th.theme { background: var(--ccs); }
    .p-pas-joue { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
    .p-pas-joue span { background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: .85rem; cursor: pointer; }
    .p-ferme { background: var(--card); border-radius: 20px; padding: 18px 20px; color: var(--ink-soft); }
    .p-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .p-vide { background: var(--card); border-radius: 20px; padding: 22px; color: var(--ink-soft); }

    /* Élève par élève */
    .p-cherche { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 18px; flex-wrap: wrap; }
    .p-champ { position: relative; flex: 1; min-width: 220px; max-width: 380px; }
    .p-champ input { width: 100%; min-height: 48px; border: 2px solid var(--line); border-radius: 14px; padding: 0 16px; font: inherit; background: var(--card); color: var(--ink); }
    .p-resultats { position: absolute; left: 0; right: 0; top: 52px; z-index: 5; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 6px; display: grid; gap: 2px; box-shadow: var(--shadow); }
    .p-resultats[hidden] { display: none; }
    .p-resultats button { border: 0; background: transparent; text-align: left; padding: 8px 10px; border-radius: 10px; display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .p-resultats button:hover, .p-resultats button:focus { background: var(--doux); }
    .p-resultats p { margin: 6px 10px; color: var(--ink-soft); font-size: .9rem; }
    .p-nav { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 14px; font-weight: 700; min-height: 48px; }
    .p-nav:hover { border-color: var(--ink); }
    .p-hero { background: var(--entete); color: var(--entete-txt); border-radius: 22px; padding: 22px; display: flex; align-items: center; gap: 18px; margin-bottom: 18px; flex-wrap: wrap; }
    .p-hero .ini { width: 64px; height: 64px; font-size: 1.3rem; }
    .p-hero h2 { font-size: 1.7rem; color: var(--entete-txt); }
    .p-hero p { margin: 4px 0 0; color: var(--entete-soft); font-size: .9rem; }
    .p-test { display: inline-block; margin-left: 8px; vertical-align: middle; background: var(--sun); color: #15231E; border-radius: 8px; padding: 2px 8px; font-family: var(--text); font-size: .75rem; font-weight: 700; letter-spacing: 0; }
    .p-code { margin-left: auto; text-align: right; }
    .p-code b { display: inline-block; font-family: var(--display); font-size: 1.3rem; letter-spacing: .06em; background: var(--entete-2); padding: 6px 14px; border-radius: 12px; }
    .p-code small { display: block; color: var(--entete-soft); font-size: .8rem; margin-top: 4px; }
    .p-fiche { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 16px; }
    .p-fiche { overflow: hidden; }
    .p-fiche-tete { display: flex; align-items: center; gap: 14px; margin: -18px -20px 10px; padding: 14px 20px; background: var(--ccs, var(--doux)); border-top: 8px solid var(--cc, var(--line)); }
    .p-fiche-tete h3 { font-family: var(--text); font-size: 1.05rem; line-height: 1.25; letter-spacing: 0; font-weight: 700; }
    .p-fiche-tete p { margin: 2px 0 0; color: var(--ink-soft); font-size: .85rem; }
    .p-act { border-top: 1px solid var(--line); padding: 12px 0; }
    .p-ligne { display: flex; align-items: center; gap: 12px; }
    .p-ligne .t { flex: 1; font-weight: 700; min-width: 0; }
    .p-ligne .jauge { width: 140px; height: 10px; border-radius: 5px; background: var(--vide); overflow: hidden; flex: none; }
    .p-ligne .jauge i { display: block; height: 100%; border-radius: 5px; }
    .p-ligne .x { font-weight: 800; font-family: var(--display); font-size: 1.05rem; min-width: 64px; text-align: right; flex: none; }
    .p-ligne .mot { color: var(--ink-soft); font-size: .82rem; min-width: 62px; flex: none; }
    .p-themes { margin: 8px 0 0 4px; display: grid; gap: 6px; }
    .p-th { background: var(--doux); border-radius: 14px; padding: 10px 14px; }
    .p-th .p-ligne .t { font-weight: 600; font-size: .95rem; }
    .p-th .p-ligne .jauge { width: 100px; height: 8px; }
    .p-niv { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .p-niv span { background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 4px 10px; font-size: .85rem; }
    .p-niv b { font-family: var(--display); }
    .p-jeux-eleve li { margin: 4px 0; }

    @media (max-width: 760px) {
      .p-cles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .p-cle b { font-size: 1.9rem; }
      .p-maj span { display: none; }
      .p-partie { padding: 10px 12px 12px; font-size: 1rem; }
      .p-ligne .jauge { display: none; }
      .p-code { margin-left: 0; text-align: left; }
      .p-marque h1 { font-size: 1.35rem; }
      /* Tableaux : colonne des noms resserrée, pour voir les chiffres à côté */
      .p-tab .p-nom .ini, .p-tab .p-nom small { display: none; }
      .p-tab td:first-child, .p-tab th:first-child { white-space: normal; min-width: 110px; max-width: 130px; padding-right: 6px; font-size: .88rem; }
    }
    @media (max-width: 420px) {
      .p-marque p { display: none; }
      .p-partie svg { display: none; }
      .p-hero h2 { font-size: 1.35rem; }
    }
  </style>
</head>
<body>
  <header class="p-entete"><div class="p-entete-in">
    <div class="p-marque">
      <svg width="46" height="46" viewBox="0 0 110 110" aria-hidden="true"><rect width="110" height="110" rx="24" fill="#22352E"/><g fill="#FFF4E4"><rect x="20" y="64" width="14" height="24" rx="2"/><rect x="40" y="52" width="14" height="36" rx="2"/><rect x="60" y="38" width="14" height="50" rx="2"/></g><circle cx="72" cy="52" r="17" fill="#22352E" stroke="#F09080" stroke-width="6"/><line x1="84" y1="64" x2="96" y2="78" stroke="#F09080" stroke-width="7" stroke-linecap="round"/></svg>
      <div><h1>Suivi SGN</h1><p>Espace professeur · M. Lefebvre</p></div>
      <div class="p-maj" id="maj" hidden><span id="maj-texte"></span><button class="btn-clair" type="button" id="actualiser">↻ Actualiser</button></div>
    </div>
    <nav class="p-parties" id="parties" hidden aria-label="Parties du suivi">
      <button class="p-partie" type="button" data-partie="classe" aria-pressed="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M17.5 14.6c2.3.4 3.6 2 4 4.9"/></svg>La classe</button>
      <button class="p-partie" type="button" data-partie="eleve" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.7-4 3.6-6.2 7.5-6.2s6.8 2.2 7.5 6.2"/></svg>Élève par élève</button>
    </nav>
  </div></header>
  <main class="wrap p-page" id="zone"></main>
  <script src="data/config.js"></script>
  <script>
  /* Page de suivi du professeur (aucun lien vers elle sur le site, mot de passe vérifié par le script Google).
     Deux parties : « La classe » (statistiques) et « Élève par élève » (la fiche d'un élève reprend exactement
     ce que l'élève voit sur ses écrans : mêmes chiffres, mêmes mots, même ordre). */
  (function () {
    "use strict";
    var CFG = window.SGN.config, ADRESSE = (CFG.comptes || {}).adresse || "";
    var zone = document.getElementById("zone");
    var CLE_NOMS = "sgn-prof-noms", CLE_AUTRES = "sgn-prof-autres";

    function el(tag, props) {
      var n = document.createElement(tag), kids = Array.prototype.slice.call(arguments, 2);
      Object.keys(props || {}).forEach(function (k) {
        var v = props[k]; if (v === null || v === undefined || v === false) { return; }
        if (k === "class") { n.className = v; } else if (k === "text") { n.textContent = v; } else if (k === "html") { n.innerHTML = v; }
        else if (k.slice(0, 2) === "on") { n.addEventListener(k.slice(2), v); } else { n.setAttribute(k, v === true ? "" : v); }
      });
      (function add(l) { l.forEach(function (c) { if (c === null || c === undefined || c === false) { return; } if (Array.isArray(c)) { add(c); } else { n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); } }); })(kids);
      return n;
    }
    function vider(n) { while (n.firstChild) { n.removeChild(n.firstChild); } return n; }
    function pct(a, b) { return b ? Math.floor(a / b * 100) : 0; }
    function pluriel(n, un, plusieurs) { return n + " " + (n > 1 ? plusieurs : un); }

    /* ---------- Noms et groupes ----------
       D'abord ceux de la feuille Google (colonnes C et D de l'onglet « Codes »), envoyés seulement après le mot de passe ;
       sinon ceux d'un fichier eleves-codes.csv ouvert dans ce navigateur. */
    var feuille = null;
    function nomFeuille(t) {
      /* « Nina AMARO » devient « AMARO Nina » : les mots en majuscules (le nom) passent devant. */
      var mots = String(t || "").trim().split(/\s+/).filter(Boolean), fin = [];
      var parenthese = mots.findIndex(function (m) { return m.charAt(0) === "("; });
      if (parenthese >= 0) { fin = mots.splice(parenthese); }
