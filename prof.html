<title>Révision SGN a déménagé</title>
<script>
  /* Le site a déménagé sur la Forge des communs numériques éducatifs : on garde la page demandée (et le #/… de l'application). */

    var chemin = location.pathname.replace(/^\/sgn\/?/, "").replace(/^index\.html$/, "");
    location.replace("https://sgn-lefebvre.forge.apps.education.fr/" + chemin + location.search + location.hash);
  })();
</script>

  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #EEF3EF; color: #15231E; font: 18px/1.5 system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }

</style>
