# Publication du site sur la Forge des communs numériques éducatifs (GitLab Pages).
# Seuls les fichiers du site sont copiés dans « public » : ni CLAUDE.md, ni LISEZMOI.md, ni ce fichier ne sont servis.
pages:
  script:
    - mkdir -p public
    - cp -r index.html prof.html assets data activites public/
    - if [ -d documents ]; then cp -r documents public/; fi
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
